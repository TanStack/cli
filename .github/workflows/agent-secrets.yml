name: Agent secrets

on:
  pull_request:

permissions:
  contents: read

jobs:
  gglint:
    name: gglint secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: corridor/gglint@fb36ea3940f571edc5a1cab08cd155401b46d3a4 # v0.5.1
        with:
          command: secrets
          comment: "false"
